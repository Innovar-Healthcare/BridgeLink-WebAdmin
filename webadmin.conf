# BridgeLink Web Administrator — runtime configuration
#
# On Docker:        overwritten at container start by docker-entrypoint.sh
#                   using values from docker-compose environment: (or -e flags).
# On Linux / macOS: edit this file after extracting the tar.gz artifact.
# On Windows (INNO installer): overwritten by the setup wizard during install.
#
# This file is the single source of truth — all four delivery channels copy
# from the repo root. Edit docker-compose.yml (not this file) for Docker.
PORT=3000
BRIDGELINK_SERVER_URL=https://localhost:8443

# TLS certificate (optional). Uncomment BOTH lines to serve HTTPS with your own
# CA-issued certificate on any delivery channel. server.js reads these paths
# as-is — use an absolute path; a relative path resolves against the directory
# the server is started from (the launchers start in the application directory).
# Leave them commented to keep the default self-signed behavior handled by the
# launcher.
# SSL_CERT_FILE=
# SSL_KEY_FILE=

# BridgeLink server certificate pinning (optional). By default WebAdmin accepts
# the BridgeLink server's certificate even if it is self-signed. Set this to the
# absolute path of a PEM file holding the CA (or the self-signed certificate)
# that signed it, and WebAdmin refuses any other certificate. The certificate
# must also name the host used in BRIDGELINK_SERVER_URL (its subject or SAN), or
# the connection is refused. If the file cannot be read, every login fails until
# it can.
# BRIDGELINK_CA_CERT=
