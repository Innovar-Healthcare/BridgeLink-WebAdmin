<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Orange circle background -->
  <circle cx="50" cy="50" r="50" fill="#f47c20"/>
  <!-- Dark navy bridge arch sweeping from lower-left to upper-right -->
  <path d="M 10 66 C 14 28 58 9 90 30" stroke="#1e3560" stroke-width="10.5" stroke-linecap="round"/>
  <!-- Three white bridge pillars -->
  <rect x="27" y="51" width="9.5" height="24" rx="2" fill="white"/>
  <rect x="45" y="44" width="9.5" height="31" rx="2" fill="white"/>
  <rect x="63" y="51" width="9.5" height="24" rx="2" fill="white"/>
  <!-- White curved base/road -->
  <path d="M 20 79 Q 50 93 80 74" stroke="white" stroke-width="6" stroke-linecap="round"/>
</svg>
